<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f97316">
    <title>Offline | Summit Stories</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; color: #111827; background: #fff7ed; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: 100%; max-width: 440px; padding: 32px; border: 1px solid #fed7aa; border-radius: 24px; background: #fff; text-align: center; }
      img { width: 96px; height: 96px; }
      h1 { font-size: 1.75rem; margin: 20px 0 12px; }
      p { color: #4b5563; line-height: 1.7; }
      a { display: inline-block; margin-top: 12px; border-radius: 999px; background: #f97316; color: #fff; padding: 12px 24px; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fdba74; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) { :root { color: #f9fafb; background: #030712; } main { background: #111827; border-color: #374151; } p { color: #d1d5db; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Summit Stories">
      <h1>You&rsquo;re offline</h1>
      <p>Reconnect to explore stories, view photos, or continue writing your next adventure.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
